version: '3'

services:
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ./frontend
      dockerfile: frontend.dockerfile
    ports:
      - 3000:3000
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    restart: always
    depends_on:
      - backend
    networks:
      - fullstack-network
  backend:
    container_name: backend
    image: backend
    build:
      context: ./backend
      dockerfile: backend.dockerfile
    ports:
      - 4000:4000
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres?schema=public
    command: ./start.sh
    depends_on:
      - db
    networks:
      - fullstack-network
  
  nginx:
    container_name: nginx
    image: nginx
    build:
      context: ./nginx
      dockerfile: nginx.dockerfile
    ports:
      - 80:80
    depends_on:
      - frontend
      - backend
    networks:
      - fullstack-network
  db:
    container_name: db
    image: postgres:12
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fullstack-network

volumes:
  pgdata: {}

networks:
  fullstack-network:
    driver: bridge
  